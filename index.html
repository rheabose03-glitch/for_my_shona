<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Love ❤️</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f5;
            text-align: center;
            padding: 40px 20px;
            color: #4a2535;
        }

        h1 {
            font-size: 42px;
        }

        .heart {
            font-size: 70px;
        }

        .card {
            background: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            background: #ff6b9d;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
        }

        #message {
            display: none;
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="heart">❤️</div>

    <h1>Happy Boyfriend's Day</h1>

    <p>To my favourite person in the whole world.</p>

    <div class="card">

        <h2>A little reminder for you</h2>

        <p>
            Even though there are thousands of miles between us,
            you're still one of the closest people to my heart.
        </p>

        <button onclick="showMessage()">
            Click me ❤️
        </button>

        <p id="message">
            I love you more than you know 🥹❤️
        </p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
